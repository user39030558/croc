name: Build Windows executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-amd64:
    name: Windows amd64
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.27.0'
          cache: true

      - name: Build executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = '0'
          go build -buildvcs=false -trimpath -tags 'netgo,osusergo' -ldflags '-s -w -buildid=' -o dist/croc-windows-amd64-hybrid.exe .

      - name: Verify executable and create checksum
        shell: pwsh
        run: |
          & ./dist/croc-windows-amd64-hybrid.exe --version
          $hash = (Get-FileHash -Algorithm SHA256 ./dist/croc-windows-amd64-hybrid.exe).Hash.ToLowerInvariant()
          "$hash  croc-windows-amd64-hybrid.exe" | Set-Content -Encoding ascii ./dist/croc-windows-amd64-hybrid.exe.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: croc-windows-amd64-hybrid
          path: |
            dist/croc-windows-amd64-hybrid.exe
            dist/croc-windows-amd64-hybrid.exe.sha256
          if-no-files-found: error
          retention-days: 30
